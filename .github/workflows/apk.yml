name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: ห่อเว็บเป็นแอป Android (Capacitor)
        run: |
          mkdir -p build/www && cp index.html manifest.json icon.svg build/www/
          cd build
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/assets
          npx cap init "ฟ้าแม่น" com.gukidza5.famaen --web-dir www
          npx cap add android
          # ขอสิทธิ์ตำแหน่งให้ปุ่ม 📍 ใช้ได้
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # ไอคอนแอป: แปลง icon.svg เป็น PNG แล้วให้ @capacitor/assets ทำทุกขนาด
          sudo apt-get install -y -qq librsvg2-bin >/dev/null
          mkdir -p assets && rsvg-convert -w 1024 -h 1024 ../icon.svg > assets/icon-only.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0f2a3d' --iconBackgroundColorDark '#0f2a3d'
          npx cap sync android

      - name: Build
        run: cd build/android && chmod +x gradlew && ./gradlew assembleDebug

      - name: ปล่อย APK ที่หน้า Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk fa-maen.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk fa-maen.apk --title "ฟ้าแม่น APK" --notes "build จาก ${GITHUB_SHA::7}"
