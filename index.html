<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a3d">
<link rel="manifest" href="manifest.json">
<title>ฟ้าแม่น</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#12242f;--mute:#5d7382;--acc:#1d6fa5;--rain:#2b8fd6;--good:#2e9d5b;--warn:#d98a1c;--bad:#c9483b;--line:#d8e2e8}
@media (prefers-color-scheme:dark){:root{--bg:#0b1a24;--card:#122734;--ink:#e3eef4;--mute:#8aa3b2;--acc:#5fb0e6;--rain:#4aa8ec;--line:#1f3a4a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
main>*{min-width:0}
header{display:flex;gap:8px;align-items:center;padding-top:12px}
header h1{font-size:20px;margin:0;flex:1}
button,input{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600;letter-spacing:.02em}
.now{display:flex;align-items:center;gap:14px}
.now .t{font-size:52px;font-weight:700;line-height:1}
.now .d{color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;color:#fff}
.alert{font-weight:600}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.h{flex:0 0 46px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:60px;display:flex;align-items:flex-end;justify-content:center;margin:4px 0}
.bar i{display:block;width:14px;background:var(--rain);border-radius:4px 4px 0 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
td{padding:7px 4px;border-top:1px solid var(--line)}
td.r{text-align:right}
.conf{font-size:12px}
#map{height:300px;border-radius:10px}
.muted{color:var(--mute);font-size:12px}
#results button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;cursor:pointer}
</style>
</head>
<body>
<main>
  <header><h1>☁️ ฟ้าแม่น</h1><button class="btn" id="gps">📍 ตำแหน่งกู</button></header>
  <div class="search"><input id="q" placeholder="ค้นหา เช่น ไทรน้อย, เชียงใหม่"><button class="btn" id="go">ค้น</button></div>
  <div id="results" class="card" hidden></div>
  <div id="place" class="muted">กำลังโหลด…</div>

  <section class="card"><div class="now"><div class="t" id="tnow">--°</div><div><div id="wnow">-</div><div class="d" id="dnow"></div></div></div>
    <p class="alert" id="alert"></p></section>

  <section class="card"><h2>ฝน 24 ชม. ข้างหน้า (% โอกาส)</h2><div class="hours" id="hours"></div></section>

  <section class="card"><h2>7 วัน · รวม 3 โมเดล (ECMWF / GFS / ICON)</h2>
    <table id="days"></table>
    <p class="muted">"มั่นใจ" = โมเดลเห็นตรงกันแค่ไหน ยิ่งต่างกันมาก ยิ่งไม่แน่นอน</p></section>

  <section class="card"><h2>เรดาร์ฝนสด (RainViewer)</h2><div id="map"></div>
    <p class="muted" id="radarTime"></p></section>

  <p class="muted">ข้อมูล: Open-Meteo, RainViewer · ไม่มีพยากรณ์ไหนแม่น 100% ดูเปอร์เซ็นต์ประกอบ</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const MODELS=["ecmwf_ifs025","gfs_seamless","icon_seamless"];
const WC={0:"☀️ ฟ้าใส",1:"🌤️ แจ่มใสเป็นส่วนใหญ่",2:"⛅ มีเมฆบางส่วน",3:"☁️ เมฆมาก",45:"🌫️ หมอก",48:"🌫️ หมอกน้ำแข็ง",51:"🌦️ ฝนปรอย",53:"🌦️ ฝนปรอย",55:"🌦️ ฝนปรอยหนัก",61:"🌧️ ฝนเล็กน้อย",63:"🌧️ ฝนปานกลาง",65:"🌧️ ฝนหนัก",80:"🌦️ ฝนซู่",81:"🌧️ ฝนซู่แรง",82:"⛈️ ฝนซู่หนักมาก",95:"⛈️ พายุฝนฟ้าคะนอง",96:"⛈️ พายุ+ลูกเห็บ",99:"⛈️ พายุ+ลูกเห็บหนัก"};
const wc=c=>WC[c]||"🌡️";
const DAY=["อา","จ","อ","พ","พฤ","ศ","ส"];
let map,radar;

function save(p){try{localStorage.setItem("place",JSON.stringify(p))}catch(e){}}
function loadSaved(){try{return JSON.parse(localStorage.getItem("place"))}catch(e){return null}}

async function load(p){
  save(p);$("place").textContent="📍 "+p.name;
  const base=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&timezone=auto`;
  try{
    const [best,multi]=await Promise.all([
      fetch(base+"&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m&hourly=precipitation_probability,precipitation&daily=weather_code,precipitation_probability_max&forecast_days=7").then(r=>r.json()),
      fetch(base+"&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&forecast_days=7&models="+MODELS.join(",")).then(r=>r.json())
    ]);
    renderNow(best);renderHours(best);renderDays(best,multi);renderMap(p);
  }catch(e){$("place").textContent="โหลดไม่ได้: เช็คเน็ตแล้วลองใหม่"}
}

function renderNow(b){
  const c=b.current;
  $("tnow").textContent=Math.round(c.temperature_2m)+"°";
  $("wnow").textContent=wc(c.weather_code);
  $("dnow").textContent=`รู้สึกเหมือน ${Math.round(c.apparent_temperature)}° · ความชื้น ${c.relative_humidity_2m}%`;
  // หาชั่วโมงแรกที่ฝน >=50%
  const now=Date.now(),H=b.hourly;
  let msg="✅ 12 ชม. ข้างหน้าน่าจะไม่มีฝน";
  for(let i=0;i<H.time.length;i++){
    const t=new Date(H.time[i]).getTime();
    if(t<now-3.6e6)continue; if(t>now+12*3.6e6)break;
    if(H.precipitation_probability[i]>=50){
      const hrs=Math.max(0,Math.round((t-now)/3.6e6));
      msg=`☔ โอกาสฝน ${H.precipitation_probability[i]}% ${hrs?`อีกประมาณ ${hrs} ชม.`:"ชั่วโมงนี้"} (${H.time[i].slice(11,16)} น.) พกร่มไปด้วย`;break;
    }
  }
  $("alert").textContent=msg;
}

function renderHours(b){
  const H=b.hourly,now=Date.now();let out="",n=0;
  for(let i=0;i<H.time.length&&n<24;i++){
    if(new Date(H.time[i]).getTime()<now-3.6e6)continue;n++;
    const p=H.precipitation_probability[i]??0;
    out+=`<div class="h">${p}%<div class="bar"><i style="height:${Math.max(2,p*.6)}px;opacity:${.35+p/150}"></i></div>${H.time[i].slice(11,13)}น.<br><span class="muted">${H.precipitation[i]?H.precipitation[i]+"mm":""}</span></div>`;
  }
  $("hours").innerHTML=out;
}

function stat(arr){const v=arr.filter(x=>x!=null);if(!v.length)return null;const m=v.reduce((a,b)=>a+b)/v.length;return{m,spread:Math.max(...v)-Math.min(...v)}}

function renderDays(b,m){
  const D=m.daily;let rows="";
  for(let i=0;i<D.time.length;i++){
    const hi=stat(MODELS.map(k=>D["temperature_2m_max_"+k]?.[i]));
    const lo=stat(MODELS.map(k=>D["temperature_2m_min_"+k]?.[i]));
    const rn=stat(MODELS.map(k=>D["precipitation_sum_"+k]?.[i]));
    const spread=(hi?.spread||0)+(rn?(rn.spread/(rn.m+5))*3:0);
    const [lbl,col]=spread<2.5?["สูง","var(--good)"]:spread<5?["กลาง","var(--warn)"]:["ต่ำ","var(--bad)"];
    const d=new Date(D.time[i]);
    rows+=`<tr><td>${i?DAY[d.getDay()]+" "+d.getDate():"วันนี้"}</td><td>${wc(b.daily.weather_code[i]).split(" ")[0]}</td>
      <td class="r">💧${b.daily.precipitation_probability_max[i]??"-"}%<br><span class="muted">${rn?rn.m.toFixed(1):"-"}mm</span></td>
      <td class="r"><b>${hi?Math.round(hi.m):"-"}°</b> / ${lo?Math.round(lo.m):"-"}°</td>
      <td class="r"><span class="pill conf" style="background:${col}">${lbl}</span></td></tr>`;
  }
  $("days").innerHTML=rows;
}

async function renderMap(p){
  if(!window.L)return;
  if(!map){map=L.map("map",{attributionControl:false}).setView([p.lat,p.lon],8);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",{maxZoom:12}).addTo(map);}
  else map.setView([p.lat,p.lon],8);
  try{
    const j=await fetch("https://api.rainviewer.com/public/weather-maps.json").then(r=>r.json());
    const f=j.radar.past.at(-1);
    if(radar)map.removeLayer(radar);
    radar=L.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:.7,maxNativeZoom:7,maxZoom:12}).addTo(map);
    $("radarTime").textContent="อัปเดตเรดาร์ "+new Date(f.time*1000).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";
  }catch(e){$("radarTime").textContent="โหลดเรดาร์ไม่ได้"}
}

async function search(){
  const q=$("q").value.trim();if(!q)return;
  const box=$("results");box.hidden=false;box.textContent="กำลังค้น…";
  let list=[];
  try{
    // OpenStreetMap รู้จักชื่อไทยถึงระดับอำเภอ/ตำบล
    const j=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=th&q=${encodeURIComponent(q)}`).then(r=>r.json());
    list=j.map(r=>({name:r.display_name.split(",").slice(0,3).join(",").trim(),lat:+(+r.lat).toFixed(3),lon:+(+r.lon).toFixed(3),full:r.display_name}));
  }catch(e){}
  const esc=s=>s.replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
  box.innerHTML=list.map(p=>`<button data-p="${esc(JSON.stringify({name:p.name,lat:p.lat,lon:p.lon}))}">${esc(p.full)}</button>`).join("")||"ไม่เจอ ลองพิมพ์ชื่ออำเภอหรือจังหวัด";
}
$("results").onclick=e=>{const d=e.target.dataset.p;if(d){$("results").hidden=true;load(JSON.parse(d))}};
$("go").onclick=search;$("q").onkeydown=e=>{if(e.key==="Enter")search()};
$("gps").onclick=()=>navigator.geolocation?.getCurrentPosition(
  pos=>load({name:"ตำแหน่งปัจจุบัน",lat:+pos.coords.latitude.toFixed(3),lon:+pos.coords.longitude.toFixed(3)}),
  ()=>alert("เปิดสิทธิ์ตำแหน่งไม่ได้ ใช้ค้นหาชื่อเมืองแทน"));

load(loadSaved()||{name:"กรุงเทพฯ",lat:13.754,lon:100.501});
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
